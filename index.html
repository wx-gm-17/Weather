<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<script>
// Inside renderChart(), update your options to this:
function renderChart() {
  const ctx = document.getElementById('fullChart');
  if(fullChartInstance) fullChartInstance.destroy();
  
  fullChartInstance = new Chart(ctx, {
    type: 'line',
    data: { 
      labels: allHistory.map(d => new Date(d.date)),
      datasets: [{ 
        data: allHistory.map(d => d[getVarKey(currentVar)]), 
        borderColor: '#00d2ff', 
        backgroundColor: 'rgba(0, 210, 255, 0.1)',
        fill: true, tension: 0.3, pointRadius: 0 
      }] 
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: false,
      scales: {
        x: { 
          type: 'time', 
          time: { unit: 'hour' },
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#8899a6', autoSkip: true, maxTicksLimit: 6 } // Keeps labels clean
        },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6' } }
      },
      plugins: {
        legend: { display: false },
        zoom: {
          pan: {
            enabled: true,
            mode: 'x', // Allow panning left/right
            threshold: 10
          },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true }, // Re-enables mobile pinch
            mode: 'x'
          }
        }
      }
    }
  });
}
</script>
