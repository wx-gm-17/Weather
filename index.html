<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cannoli's Weather Station</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>
body { font-family:Segoe UI, Arial; margin:0; background:#0c1b2a; color:white; overflow: hidden; position: fixed; width: 100%; height: 100%; }
header { background:#142b44; padding:20px; text-align:center; font-size:28px; }
.dashboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; padding:10px; }
.card { background:#1c3d5a; padding:15px 10px; border-radius:12px; text-align:center; cursor:pointer; }
.card:hover { background:#3a5b7c; }

.fullscreen-chart {
  display:none;
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background:#0c1b2a; z-index:1000;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
  touch-action: none; /* Prevents mobile pull-to-refresh */
}

.chart-container {
  position: relative;
  width: 95%;
  height: 60vh;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  cursor: grab; /* Shows user they can pan */
}

.chart-container:active { cursor: grabbing; }

#fullChart {
  touch-action: none; 
  user-select: none;
}

.fullscreen-toolbar { 
  display:flex; 
  justify-content:center; 
  gap:8px; 
  padding:15px; 
  flex-wrap:wrap; 
  width:100%; 
}
.fullscreen-toolbar button { 
  background:#1c3d5a; 
  color:white; 
  border:none; 
  padding:12px 16px; 
  font-size:14px; 
  border-radius:8px; 
  cursor:pointer; 
}
.close-chart { background:#d32f2f !important; font-weight: bold; }
#chartSubtitle { margin-bottom: 10px; font-size: 14px; color: #aaa; text-align: center; }
</style>
</head>

<body>
<header>🐾 Cannoli's Weather Station</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')">Temp<br><span id="temp">--</span>°F</div>
  <div class="card" onclick="openChart('humidity')">Humidity<br><span id="humidity">--</span>%</div>
  <div class="card" onclick="openChart('pressure')">Pressure<br><span id="pressure">--</span> inHg</div>
  <div class="card" onclick="openChart('wind')">Wind<br><span id="wind">--</span> mph</div>
  <div class="card" onclick="openChart('gust')">Gust<br><span id="gust">--</span> mph</div>
  <div class="card" onclick="openChart('rain')">Rain<br><span id="rain">--</span> in</div>
</div>

<div class="fullscreen-chart" id="fullscreenChartContainer">
  <div class="fullscreen-toolbar">
    <button onclick="setIntervalHours(6)">6h</button>
    <button onclick="setIntervalHours(12)">12h</button>
    <button onclick="setIntervalHours(24)">24h</button>
    <button onclick="resetZoom()">Reset</button>
    <button class="close-chart" onclick="closeChart()">✕ Close</button>
  </div>
  <div id="chartSubtitle">Pinch/Scroll to Zoom • Drag to Pan<br><small>Last <span id="displayHours">24</span> hours</small></div>
  <div class="chart-container">
    <canvas id="fullChart"></canvas>
  </div>
</div>

<footer id="time" style="padding:20px;text-align:center;font-size:12px;opacity:0.7;"></footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = [];
let currentVariable = 'temp';
let currentInterval = 24;
let fullChartInstance = null;

async function loadCurrent() {
  try {
    const url = `https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`;
    const r = await fetch(url);
    const data = await r.json();
    const w = data[0].lastData;
    document.getElementById("temp").innerHTML = w.tempf || "--";
    document.getElementById("humidity").innerHTML = w.humidity || "--";
    document.getElementById("pressure").innerHTML = w.baromrelin || "--";
    document.getElementById("wind").innerHTML = w.windspeedmph || "0";
    document.getElementById("gust").innerHTML = w.windgustmph || "0";
    document.getElementById("rain").innerHTML = w.dailyrainin || "0.00";
    document.getElementById("time").innerHTML = "Last update: " + new Date(w.date).toLocaleString();
  } catch(e){ console.error(e); }
}

async function loadHistory() {
  try {
    const url = `https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`;
    const r = await fetch(url);
    if(r.status === 429) return;
    const history = await r.json();
    if(Array.isArray(history)) {
        allHistory = history.reverse();
        if(fullChartInstance) renderFullChart();
    }
  } catch(e){ console.error(e); }
}

function openChart(variable){
  currentVariable = variable;
  document.getElementById('fullscreenChartContainer').style.display = 'flex';
  renderFullChart();
}

function closeChart(){
  document.getElementById('fullscreenChartContainer').style.display = 'none';
  if(fullChartInstance) fullChartInstance.destroy();
  fullChartInstance = null;
}

function resetZoom(){
  if(fullChartInstance) fullChartInstance.resetZoom();
}

function setIntervalHours(h){
  currentInterval = h;
  document.getElementById('displayHours').innerText = h;
  renderFullChart();
}

function aggregateHourly(data){
  const grouped = {};
  data.forEach(d=>{
    const hour = new Date(d.date); hour.setMinutes(0,0,0);
    const key = hour.getTime();
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(d);
  });
  const labels=[], values=[];
  for(const k of Object.keys(grouped).sort((a,b)=>a-b)){
    const arr = grouped[k];
    labels.push(new Date(parseInt(k)));
    const valMap = {
      temp: arr.reduce((s,v)=>(s + (v.tempf || 0)),0)/arr.length,
      humidity: arr.reduce((s,v)=>(s + (v.humidity || 0)),0)/arr.length,
      wind: arr.reduce((s,v)=>(s + (v.windspeedmph || 0)),0)/arr.length,
      gust: arr.reduce((s,v)=>(s + (v.windgustmph || 0)),0)/arr.length,
      rain: arr.reduce((s,v)=>(s + (v.hourlyrainin || v.rainhourlyin || 0)),0)
    };
    values.push(valMap[currentVariable]);
  }
  return {labels, values};
}

function getChartData(){
  const cutoff = Date.now() - currentInterval*60*60*1000;
  const filtered = allHistory.filter(d=>new Date(d.date).getTime()>=cutoff);
  if(currentInterval >= 12) return aggregateHourly(filtered);
  const labels=[], values=[];
  filtered.forEach(d=>{
    labels.push(new Date(d.date));
    const valMap = { temp: d.tempf, humidity: d.humidity, wind: d.windspeedmph, gust: d.windgustmph, rain: (d.hourlyrainin || d.rainhourlyin || 0) };
    values.push(valMap[currentVariable]);
  });
  return {labels, values};
}

function renderFullChart(){
  const data = getChartData();
  const colorMap = {temp:"orange", humidity:"lime", wind:"cyan", gust:"magenta", rain:"#3498db"};
  const unitMap = {temp:"°F", humidity:"%", wind:"mph", gust:"mph", rain:"in"};
  if(fullChartInstance) fullChartInstance.destroy();
  const ctx = document.getElementById('fullChart').getContext('2d');
  
  fullChartInstance = new Chart(ctx,{
    type:'line',
    data:{
      labels:data.labels,
      datasets:[{
        label:currentVariable, data:data.values, borderColor:colorMap[currentVariable], backgroundColor:'rgba(255,255,255,0.05)', tension:0.3, pointRadius:0, fill: true
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation: false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        zoom:{
          pan: {
            enabled: true,
            mode: 'x',
            modifierKey: null // Allows panning without holding a key
          },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'x',
            drag: { enabled: false } // Set to false to allow panning via drag
          }
        }
      },
      scales:{
        x:{ type:'time', ticks: { color: '#666' } },
        y:{ beginAtZero: false, ticks: { color: '#666' } }
      }
    }
  });
}

async function initializeDashboard() {
  await loadCurrent();
  setTimeout(loadHistory, 1500); 
}
initializeDashboard();
setInterval(loadCurrent, 60000); 
</script>

</body>
</html>
