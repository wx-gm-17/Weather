<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060d14">
<title>Cannoli Pro Weather</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root { 
  --bg: #060d14; --card: rgba(18, 32, 47, 0.95); --accent: #00d2ff; 
  --border: rgba(255, 255, 255, 0.15); --text: #ffffff;
}

body { margin:0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

header { 
  background: #0b141d; padding: 20px; display: flex; justify-content: space-between; 
  align-items: center; border-bottom: 2px solid var(--border);
}

.paw { font-size: 40px; vertical-align: middle; margin-right: 10px; }
.btn { background: var(--accent); border: none; color: #000; padding: 12px 18px; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 14px; }
.btn-secondary { background: #1c3d5a; color: white; margin-right: 10px; }

.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 25px; }

.card { 
  background: var(--card); padding: 40px 20px; border-radius: 28px; text-align: center; 
  border: 2px solid var(--border); box-shadow: 0 15px 45px rgba(0,0,0,0.6); cursor: pointer;
}

.label { font-size: 16px; text-transform: uppercase; color: #8899a6; font-weight: 900; letter-spacing: 2px; }
.main-val { font-size: 80px; font-weight: 900; margin: 10px 0; color: #fff; line-height: 1; }
.dual-val { display: flex; justify-content: center; align-items: baseline; gap: 15px; margin: 10px 0; }
.sub-val { font-size: 20px; color: var(--accent); font-weight: 700; }

.summary-container { margin: 0 25px 40px 25px; background: #0b141d; border-radius: 20px; border: 2px solid var(--border); overflow: hidden; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 16px; }
.summary-table th { background: #14212d; color: var(--accent); padding: 15px; text-align: left; font-weight: 900; border-bottom: 1px solid var(--border); }
.summary-table td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

.overlay-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; flex-direction:column; }
.toolbar { display:flex; gap:10px; padding:15px; background: #0b141d; align-items: center; border-bottom: 2px solid var(--border); }
.content-area { flex: 1; overflow-y: auto; padding: 20px; }
.chart-container { height: 50vh; background: #000; border-radius: 16px; border: 1px solid var(--border); padding: 10px; touch-action: none; }

.table-wrapper { border-radius: 12px; border: 2px solid var(--border); overflow-x: auto; background: #0b141d; }
table { width: 100%; border-collapse: collapse; font-size: 16px; font-weight: 600; }
table th { background: #1c3d5a; padding: 12px; color: var(--accent); text-align: center; }
table td { padding: 12px; border-bottom: 1px solid var(--border); text-align: center; }

footer { padding: 30px; text-align: center; font-size: 14px; color: #556677; font-weight: 800; }
</style>
</head>
<body>

<header>
  <div><span class="paw">🐾</span><span style="letter-spacing: 3px; font-weight: 900; font-size: 22px;">CANNOLI PRO v10</span></div>
  <div style="display: flex;">
    <button class="btn btn-secondary" onclick="openMasterTable()">MASTER LOG</button>
    <button class="btn" onclick="location.reload()">REFRESH</button>
  </div>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')">
    <div class="label">Temperature</div>
    <div id="temp" class="main-val">--</div>
    <div id="dew-sub" class="sub-val">Dew: --</div>
  </div>
  
  <div class="card" onclick="openChart('wind')">
    <div class="label">Wind & Gust</div>
    <div class="dual-val">
      <div id="wind" class="main-val">--</div>
      <div id="gust" class="main-val" style="color: #ff4d4d; font-size: 50px;">--</div>
    </div>
    <div id="wind-dir-sub" class="sub-val">--</div>
  </div>

  <div class="card" onclick="openChart('humidity')"><div class="label">Humidity</div><div id="humidity" class="main-val">--</div><div class="sub-val">PERCENTAGE</div></div>
  <div class="card" onclick="openChart('solar')"><div class="label">Solar / UV</div><div id="solar" class="main-val">--</div><div id="uv-sub" class="sub-val">UV Index: --</div></div>
  <div class="card" onclick="openChart('rain')"><div class="label">Rainfall</div><div id="rain" class="main-val">--</div><div class="sub-val">DAILY TOTAL (IN)</div></div>
  <div class="card" onclick="openChart('pressure')"><div class="label">Pressure</div><div id="pressure" class="main-val">--</div><div class="sub-val">hPa</div></div>
</div>

<div class="summary-container">
  <table class="summary-table">
    <thead><tr><th>24H Comprehensive Summary</th><th>High</th><th>Low</th><th>Average</th></tr></thead>
    <tbody id="summaryBody">
      </tbody>
  </table>
</div>

<div class="overlay-view" id="overlay">
  <div class="toolbar">
    <h2 id="graphTitle" style="flex-grow:1; margin:0; font-size:20px;">Analysis</h2>
    <button class="btn btn-secondary" onclick="fullChartInstance.resetZoom()">RESET</button>
    <button class="btn btn-secondary" onclick="toggleTable()" id="toggleBtn">TABLE</button>
    <button class="btn" onclick="closeOverlay()" style="background:#ff4d4d;">✕</button>
  </div>
  <div class="content-area">
    <div class="chart-container"><canvas id="fullChart"></canvas></div>
    <div id="tableView" style="display:none; margin-top:20px;" class="table-wrapper">
      <table><thead><tr><th>Date & Time</th><th>Value</th></tr></thead><tbody id="detailBody"></tbody></table>
    </div>
  </div>
</div>

<div class="overlay-view" id="masterOverlay">
  <div class="toolbar"><h2 style="flex-grow:1;">MASTER DATA LOG</h2><button class="btn" onclick="document.getElementById('masterOverlay').style.display='none'">CLOSE</button></div>
  <div class="content-area"><div class="table-wrapper"><table id="masterTable"><thead>
    <tr><th>Time</th><th>Temp</th><th>Dew</th><th>Hum</th><th>Wind</th><th>Gust</th><th>hPa</th><th>Solar</th><th>UV</th></tr>
  </thead><tbody></tbody></table></div></div>
</div>

<footer id="status">CONNECTING...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";
let allHistory = [], fullChartInstance = null, currentVar = 'temp';

function degToCompass(num) {
    const val = Math.floor((num / 22.5) + 0.5);
    const arr = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return arr[(val % 16)];
}

async function updateUI() {
  try {
    const r = await fetch(`https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`);
    const data = await r.json();
    const w = data[0].lastData;

    document.getElementById("temp").innerText = Math.round(w.tempf) + "°";
    document.getElementById("humidity").innerText = w.humidity + "%";
    document.getElementById("wind").innerText = Math.round(w.windspeedmph);
    document.getElementById("gust").innerText = Math.round(w.windgustmph);
    document.getElementById("wind-dir-sub").innerText = `${degToCompass(w.winddir)} (${w.winddir}°)`;
    document.getElementById("solar").innerText = w.solarradiation;
    document.getElementById("uv-sub").innerText = `UV Index: ${w.uv}`;
    document.getElementById("rain").innerText = w.dailyrainin.toFixed(2);
    document.getElementById("pressure").innerText = Math.round(w.baromrelin * 33.8639);
    
    const dew = w.tempf - ((100 - w.humidity) / 5 * 1.8);
    document.getElementById("dew-sub").innerText = `Dew: ${Math.round(dew)}°`;

    document.getElementById("status").innerText = "LIVE • " + new Date().toLocaleTimeString();
    setTimeout(loadHistory, 1000);
  } catch(e) {}
}

async function loadHistory() {
  const r = await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`);
  const data = await r.json();
  allHistory = Array.isArray(data) ? data.reverse() : [];
  if(allHistory.length) buildSummary();
}

function buildSummary() {
  const params = [
    { n: 'Temperature', k: 'tempf', u: '°' },
    { n: 'Wind Speed', k: 'windspeedmph', u: ' mph' },
    { n: 'Wind Gust', k: 'windgustmph', u: ' mph' },
    { n: 'Humidity', k: 'humidity', u: '%' },
    { n: 'Solar Radiation', k: 'solarradiation', u: '' },
    { n: 'Pressure (hPa)', k: 'hpa', u: '' }
  ];
  
  const tbody = document.getElementById("summaryBody");
  tbody.innerHTML = params.map(p => {
    let vals = allHistory.map(d => p.k === 'hpa' ? d.baromrelin * 33.8639 : d[p.k]);
    const high = Math.max(...vals);
    const low = Math.min(...vals);
    const avg = vals.reduce((a,b)=>a+b)/vals.length;
    return `<tr><td>${p.n}</td><td>${Math.round(high)}${p.u}</td><td>${Math.round(low)}${p.u}</td><td>${Math.round(avg)}${p.u}</td></tr>`;
  }).join('');
}

function openChart(v) {
  currentVar = v;
  document.getElementById('graphTitle').innerText = v.toUpperCase() + " ANALYSIS";
  document.getElementById('overlay').style.display = 'flex';
  renderChart();
}

function renderChart() {
  const ctx = document.getElementById('fullChart');
  if(fullChartInstance) fullChartInstance.destroy();
  
  const isWind = currentVar === 'wind';
  const isTemp = currentVar === 'temp';
  
  const datasets = [{
    label: isTemp ? 'TEMP' : currentVar.toUpperCase(),
    data: allHistory.map(d => d[getVarKey(currentVar)]),
    borderColor: '#00d2ff', backgroundColor: 'rgba(0, 210, 255, 0.1)',
    fill: true, tension: 0.2, pointRadius: 0, borderWidth: 3
  }];

  if(isWind) {
    datasets.push({
      label: 'GUST', data: allHistory.map(d => d.windgustmph),
      borderColor: '#ff4d4d', backgroundColor: 'transparent', borderDash: [8, 4], pointRadius: 0
    });
  }
  
  if(isTemp) {
    datasets.push({
      label: 'DEW POINT', data: allHistory.map(d => d.tempf - ((100 - d.humidity) / 5 * 1.8)),
      borderColor: '#00ffaa', backgroundColor: 'transparent', borderDash: [8, 4], pointRadius: 0
    });
  }

  fullChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: allHistory.map(d => new Date(d.date)), datasets },
    options: { 
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        zoom: { pan: { enabled: true, mode: 'xy' }, zoom: { pinch: { enabled: true }, mode: 'xy' } },
        legend: { display: true, labels: { color: '#fff', font: { size: 14, weight: 'bold' } } }
      },
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#8899a6' } },
        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#8899a6' } }
      }
    }
  });
}

function getVarKey(v) { return {temp:'tempf', humidity:'humidity', wind:'windspeedmph', solar:'solarradiation', rain:'dailyrainin', pressure:'baromrelin'}[v]; }
function toggleTable() { /* same as v9 */ }
function openMasterTable() { /* same as v9 */ }
function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
