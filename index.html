<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060d14">
<title>Cannoli Station Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root { 
  --bg: #060d14; --card: rgba(18, 32, 47, 0.9); --accent: #00d2ff; 
  --border: rgba(255, 255, 255, 0.1); --glow: rgba(0, 210, 255, 0.3);
}

body { margin:0; background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

header { 
  background: #0b141d; padding: 15px 20px; display: flex; justify-content: space-between; 
  align-items: center; border-bottom: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.refresh-btn { 
  background: var(--accent); border: none; color: #060d14; padding: 8px 16px; 
  border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
}

.dashboard { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; }

.card { 
  background: var(--card); backdrop-filter: blur(15px); padding: 25px 10px; 
  border-radius: 18px; text-align: center; border: 1px solid var(--border);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4); cursor: pointer;
}

.card:active { transform: scale(0.98); }
.label { font-size: 12px; text-transform: uppercase; color: #8899a6; font-weight: 700; letter-spacing: 1.2px; }
.main-val { font-size: 46px; font-weight: 700; margin: 8px 0; color: #fff; }
.sub-val { font-size: 14px; color: var(--accent); }

/* Overlay & Pro Table */
.overlay-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; flex-direction:column; }
.toolbar { display:flex; gap:10px; padding:15px; justify-content: center; background: #0b141d; align-items: center; }
.toolbar h2 { margin: 0; font-size: 16px; color: #fff; flex-grow: 1; text-align: center; }
.tool-btn { background: #1c3d5a; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 12px; font-weight: 600; }

.content-area { flex: 1; overflow-y: auto; padding: 15px; }
.chart-container { 
  height: 40vh; background: #0b141d; border-radius: 12px; border: 1px solid var(--border); 
  padding: 10px; position: relative; touch-action: pan-y !important; /* Critical for Mobile */
}

/* Compact Table Styling */
.table-wrapper { margin-top: 15px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 12px; background: rgba(255,255,255,0.02); }
th { background: rgba(0, 210, 255, 0.1); padding: 8px; text-align: left; color: var(--accent); border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
.col-time { width: 30%; }
.col-param { width: 40%; color: #8899a6; font-style: italic; }
.col-val { width: 30%; font-weight: 700; color: #fff; text-align: right; }

footer { padding: 15px; text-align: center; font-size: 11px; color: #556677; }
</style>
</head>
<body>

<header>
  <div style="width: 70px;"></div>
  <span style="letter-spacing: 2px; font-weight: 400; font-size: 16px;">🐾 CANNOLI PRO</span>
  <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')"><div class="label">Temperature</div><div id="temp" class="main-val">--</div><div id="temp-sub" class="sub-val">H: -- L: --</div></div>
  <div class="card" onclick="openChart('humidity')"><div class="label">Humidity</div><div id="humidity" class="main-val">--</div><div id="humidity-sub" class="sub-val">--</div></div>
  <div class="card" onclick="openChart('wind')"><div class="label">Wind</div><div id="wind" class="main-val">--</div><div id="wind-sub" class="sub-val">MPH</div></div>
  <div class="card" onclick="openChart('gust')"><div class="label">Gust</div><div id="gust" class="main-val">--</div><div id="gust-sub" class="sub-val">MAX: --</div></div>
  <div class="card" onclick="openChart('rain')"><div class="label">Daily Rain</div><div id="rain" class="main-val">--</div><div id="rain-sub" class="sub-val">INCHES</div></div>
  <div class="card" onclick="openChart('pressure')"><div class="label">Pressure</div><div id="pressure" class="main-val">--</div><div id="pressure-sub" class="sub-val">InHg</div></div>
</div>

<div class="overlay-view" id="overlay">
  <div class="toolbar">
    <button class="tool-btn" onclick="toggleTable()" id="toggleBtn">Show Table</button>
    <h2 id="graphTitle">History</h2>
    <button class="tool-btn" onclick="closeOverlay()" style="background:#d32f2f;">✕</button>
  </div>
  <div class="content-area">
    <div class="chart-container"><canvas id="fullChart"></canvas></div>
    <div id="tableView" style="display:none;" class="table-wrapper">
      <table id="mainTable">
        <thead><tr><th>Time</th><th>Parameter</th><th style="text-align:right">Value</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<footer id="time">INITIALIZING METRICS...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";
let allHistory = [], fullChartInstance = null, currentVar = 'temp';

async function updateUI() {
  try {
    const r = await fetch(`https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`);
    const data = await r.json();
    const w = data[0].lastData;

    document.getElementById("temp").innerText = Math.round(w.tempf) + "°";
    document.getElementById("humidity").innerText = w.humidity + "%";
    document.getElementById("wind").innerText = Math.round(w.windspeedmph);
    document.getElementById("gust").innerText = Math.round(w.windgustmph);
    document.getElementById("rain").innerText = w.dailyrainin.toFixed(2);
    document.getElementById("pressure").innerText = w.baromrelin.toFixed(2);

    document.getElementById("time").innerText = "STATION ONLINE • " + new Date().toLocaleTimeString();
    setTimeout(loadHistory, 1200);
  } catch(e) { console.error(e); }
}

async function loadHistory() {
  try {
    const r = await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`);
    const data = await r.json();
    allHistory = Array.isArray(data) ? data.reverse() : [];
    if(allHistory.length) {
      const temps = allHistory.map(d => d.tempf);
      document.getElementById("temp-sub").innerText = `H: ${Math.round(Math.max(...temps))}° L: ${Math.round(Math.min(...temps))}°`;
      document.getElementById("gust-sub").innerText = `MAX: ${Math.max(...allHistory.map(d => d.windgustmph))} MPH`;
    }
  } catch(e) { }
}

function openChart(v) {
  currentVar = v;
  const labels = {temp:'Temperature (°F)', humidity:'Humidity (%)', wind:'Wind Speed (MPH)', gust:'Wind Gust (MPH)', rain:'Rainfall (IN)', pressure:'Pressure (InHg)'};
  document.getElementById('graphTitle').innerText = labels[v];
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('tableView').style.display = 'none';
  document.getElementById('toggleBtn').innerText = "Show Table";
  renderChart();
}

function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

function toggleTable() {
  const view = document.getElementById('tableView');
  const btn = document.getElementById('toggleBtn');
  if(view.style.display === 'none') {
    view.style.display = 'block';
    btn.innerText = "Hide Table";
    generateTable();
  } else {
    view.style.display = 'none';
    btn.innerText = "Show Table";
  }
}

function generateTable() {
  const tbody = document.querySelector("#mainTable tbody");
  const key = getVarKey(currentVar);
  const label = document.getElementById('graphTitle').innerText.split(' ')[0];
  
  tbody.innerHTML = allHistory.slice().reverse().map(d => `
    <tr>
      <td class="col-time">${new Date(d.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
      <td class="col-param">${label}</td>
      <td class="col-val">${d[key]}</td>
    </tr>
  `).join('');
}

function getVarKey(v) {
  return {temp:'tempf', humidity:'humidity', wind:'windspeedmph', gust:'windgustmph', rain:'hourlyrainin', pressure:'baromrelin'}[v];
}

function renderChart() {
  const ctx = document.getElementById('fullChart');
  if(fullChartInstance) fullChartInstance.destroy();
  
  fullChartInstance = new Chart(ctx, {
    type: 'line',
    data: { 
      labels: allHistory.map(d => new Date(d.date)),
      datasets: [{ data: allHistory.map(d => d[getVarKey(currentVar)]), borderColor: '#00d2ff', backgroundColor: 'rgba(0, 210, 255, 0.1)', fill: true, tension: 0.3, pointRadius: 0 }] 
    },
    options: { 
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6', autoSkip: true, maxTicksLimit: 6 } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6' } }
      },
      plugins: {
        legend: { display: false },
        zoom: {
          pan: { enabled: true, mode: 'x', threshold: 10 },
          zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
        }
      }
    }
  });
}

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
