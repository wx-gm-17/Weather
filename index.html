<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cannoli's Weather Station</title>

<!-- Chart.js + zoom plugin + luxon adapter -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>
body {
  font-family:Segoe UI, Arial;
  background:#0c1b2a;
  color:white;
  margin:0;
}
header {
  background:#142b44;
  padding:20px;
  text-align:center;
  font-size:28px;
}
.dashboard {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:15px;
}
.card {
  background:#1c3d5a;
  padding:15px;
  border-radius:12px;
  text-align:center;
}
.temp {
  font-size:50px;
  font-weight:bold;
}
.value {
  font-size:22px;
}
canvas {
  background:white;
  border-radius:10px;
  max-width:100%;
}
.graph {
  padding:15px;
}
.windCompass {
  width:100px;
  height:100px;
  border:4px solid white;
  border-radius:50%;
  margin:auto;
  position:relative;
}
.arrow {
  width:4px;
  height:40px;
  background:red;
  position:absolute;
  top:10px;
  left:50%;
  transform-origin:bottom center;
}
footer {
  text-align:center;
  padding:15px;
  opacity:.7;
}
.controls {
  background:#142b44;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.controls button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#1c3d5a;
  color:white;
  cursor:pointer;
  font-size:14px;
}
.controls button:hover {
  background:#3a5b7c;
}
</style>

</head>

<body>

<header>
🌤 Cannoli's Weather Station
</header>

<div class="dashboard">
  <div class="card">
    Temperature
    <div class="temp" id="temp">--</div>
  </div>
  <div class="card">
    Humidity
    <div class="value" id="humidity">--</div>
  </div>
  <div class="card">
    Pressure
    <div class="value" id="pressure">--</div>
  </div>
  <div class="card">
    Wind Speed
    <div class="value" id="wind">--</div>
  </div>
  <div class="card">
    Wind Gust
    <div class="value" id="gust">--</div>
  </div>
  <div class="card">
    Rain Today
    <div class="value" id="rain">--</div>
  </div>
  <div class="card">
    Wind Direction
    <div class="windCompass">
      <div class="arrow" id="arrow"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button onclick="resetZoom()">Reset Zoom</button>
  <button onclick="setIntervalHours(6)">Last 6h</button>
  <button onclick="setIntervalHours(12)">Last 12h</button>
  <button onclick="setIntervalHours(24)">Last 24h</button>
</div>

<div class="graph">
  <h3 style="text-align:center;">Temperature</h3>
  <canvas id="tempChart"></canvas>
</div>

<div class="graph">
  <h3 style="text-align:center;">Wind Speed</h3>
  <canvas id="windChart"></canvas>
</div>

<div class="graph">
  <h3 style="text-align:center;">Humidity</h3>
  <canvas id="humidityChart"></canvas>
</div>

<div class="graph">
  <h3 style="text-align:center;">Rain</h3>
  <canvas id="rainChart"></canvas>
</div>

<footer id="time"></footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = []; // store 288 records
let currentInterval = 24; // default last 24h

let charts = {};

async function loadCurrent() {
  const url = `https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`;
  const r = await fetch(url);
  const data = await r.json();
  const w = data[0].lastData;

  document.getElementById("temp").innerHTML = w.tempf + "°F";
  document.getElementById("humidity").innerHTML = w.humidity + "%";
  document.getElementById("pressure").innerHTML = w.baromrelin + " inHg";
  document.getElementById("wind").innerHTML = w.windspeedmph + " mph";
  document.getElementById("gust").innerHTML = w.windgustmph + " mph";
  document.getElementById("rain").innerHTML = w.dailyrainin + " in";
  document.getElementById("arrow").style.transform = `rotate(${w.winddir}deg)`;
  document.getElementById("time").innerHTML = "Last update: " + new Date(w.date).toLocaleString();
}

async function loadHistory() {
  const url = `https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`;
  const r = await fetch(url);
  const history = await r.json();

  // store full history for interval filtering
  allHistory = history.reverse();
  updateCharts();
}

// filter data by hours
function getFilteredData(hours) {
  const now = Date.now();
  const cutoff = now - hours*60*60*1000;
  return allHistory.filter(d => new Date(d.date).getTime() >= cutoff);
}

function updateCharts() {
  const filtered = getFilteredData(currentInterval);
  const temps=[], winds=[], humidity=[], rain=[], times=[];

  filtered.forEach(p => {
    temps.push(p.tempf);
    winds.push(p.windspeedmph);
    humidity.push(p.humidity);
    rain.push(p.hourlyrainin);
    times.push(new Date(p.date));
  });

  createChart("tempChart","Temperature",temps,times,"orange","°F");
  createChart("windChart","Wind Speed",winds,times,"cyan","mph");
  createChart("humidityChart","Humidity",humidity,times,"lime","%");
  createChart("rainChart","Rain",rain,times,"blue","in");
}

// create chart if doesn't exist, else update data
function createChart(id,label,data,labels,color,unit){
  if(charts[id]){
    charts[id].data.labels = labels;
    charts[id].data.datasets[0].data = data;
    charts[id].update();
  } else {
    charts[id] = new Chart(document.getElementById(id),{
      type:"line",
      data:{labels:labels,datasets:[{label,label,data,borderColor:color,backgroundColor:"rgba(255,255,255,0.1)",tension:0.4,pointRadius:0}]},
      options:{
        responsive:true,
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:false},
          zoom:{
            zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:"x"},
            pan:{enabled:true,mode:"x"}
          },
          tooltip:{
            callbacks:{
              label:function(context){return context.dataset.label+": "+context.formattedValue+" "+unit;}
            }
          }
        },
        scales:{
          x:{type:"time",time:{tooltipFormat:"MMM d, h:mm a"}},
          y:{beginAtZero:false}
        }
      }
    });
  }
}

// control panel functions
function resetZoom(){
  Object.values(charts).forEach(c=>c.resetZoom());
}

function setIntervalHours(h){
  currentInterval = h;
  updateCharts();
}

// initial load
loadCurrent();
loadHistory();
setInterval(loadCurrent,60000); // refresh live data every 60s
</script>

</body>
</html>
