<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Cannoli's Weather Station</title>

<!-- Chart.js + zoom plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>
body {
  font-family:Segoe UI, Arial;
  background:#0c1b2a;
  color:white;
  margin:0;
}
header {
  background:#142b44;
  padding:25px;
  text-align:center;
  font-size:32px;
}
.dashboard {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}
.card {
  background:#1c3d5a;
  padding:20px;
  border-radius:12px;
  text-align:center;
}
.temp {
  font-size:70px;
  font-weight:bold;
}
.value {
  font-size:28px;
}
canvas {
  background:white;
  border-radius:10px;
}
.graph {
  padding:20px;
}
.windCompass {
  width:120px;
  height:120px;
  border:5px solid white;
  border-radius:50%;
  margin:auto;
  position:relative;
}
.arrow {
  width:4px;
  height:50px;
  background:red;
  position:absolute;
  top:15px;
  left:50%;
  transform-origin:bottom center;
}
footer {
  text-align:center;
  padding:20px;
  opacity:.7;
}
</style>
</head>

<body>

<header>
🌤 Cannoli's Weather Station
</header>

<div class="dashboard">
  <div class="card">
    Temperature
    <div class="temp" id="temp">--</div>
  </div>

  <div class="card">
    Humidity
    <div class="value" id="humidity">--</div>
  </div>

  <div class="card">
    Pressure
    <div class="value" id="pressure">--</div>
  </div>

  <div class="card">
    Wind Speed
    <div class="value" id="wind">--</div>
  </div>

  <div class="card">
    Wind Gust
    <div class="value" id="gust">--</div>
  </div>

  <div class="card">
    Rain Today
    <div class="value" id="rain">--</div>
  </div>

  <div class="card">
    Wind Direction
    <div class="windCompass">
      <div class="arrow" id="arrow"></div>
    </div>
  </div>
</div>

<div class="graph">
  <h2 style="text-align:center;">Temperature (24h)</h2>
  <canvas id="tempChart"></canvas>
</div>

<div class="graph">
  <h2 style="text-align:center;">Wind Speed (24h)</h2>
  <canvas id="windChart"></canvas>
</div>

<div class="graph">
  <h2 style="text-align:center;">Humidity (24h)</h2>
  <canvas id="humidityChart"></canvas>
</div>

<div class="graph">
  <h2 style="text-align:center;">Rain (24h)</h2>
  <canvas id="rainChart"></canvas>
</div>

<footer id="time"></footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = [];
let currentInterval = 24;
let charts = {};

// Load current live conditions
async function loadCurrent() {
  const url = `https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`;
  const r = await fetch(url);
  const data = await r.json();
  const w = data[0].lastData;

  document.getElementById("temp").innerHTML = w.tempf + "°F";
  document.getElementById("humidity").innerHTML = w.humidity + "%";
  document.getElementById("pressure").innerHTML = w.baromrelin + " inHg";
  document.getElementById("wind").innerHTML = w.windspeedmph + " mph";
  document.getElementById("gust").innerHTML = w.windgustmph + " mph";
  document.getElementById("rain").innerHTML = w.dailyrainin + " in";
  document.getElementById("arrow").style.transform = `rotate(${w.winddir}deg)`;
  document.getElementById("time").innerHTML = "Last update: " + new Date(w.date).toLocaleString();
}

// Load historical data
async function loadHistory() {
  const url = `https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`;
  const r = await fetch(url);
  const history = await r.json();

  allHistory = history.reverse();
  updateCharts();
}

// Group data by hour (average values)
function aggregateHourly(data){
  const grouped = {};
  data.forEach(d=>{
    const hour = new Date(d.date);
    hour.setMinutes(0,0,0); // truncate to hour
    const key = hour.getTime();
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(d);
  });
  const labels=[], temp=[], wind=[], humidity=[], rain=[];
  for(const k of Object.keys(grouped).sort((a,b)=>a-b)){
    const arr = grouped[k];
    labels.push(new Date(parseInt(k)));
    temp.push(arr.reduce((s,v)=>s+v.tempf,0)/arr.length);
    wind.push(arr.reduce((s,v)=>s+v.windspeedmph,0)/arr.length);
    humidity.push(arr.reduce((s,v)=>s+v.humidity,0)/arr.length);
    rain.push(arr.reduce((s,v)=>s+v.hourlyrainin,0));
  }
  return {labels,temp,wind,humidity,rain};
}

// Filter data by interval and aggregate if needed
function getProcessedData(){
  const now = Date.now();
  const cutoff = now - currentInterval*60*60*1000;
  const filtered = allHistory.filter(d=>new Date(d.date).getTime() >= cutoff);

  // Aggregate if interval >=12h for clarity
  if(currentInterval>=12){
    return aggregateHourly(filtered);
  } else {
    const labels=[], temp=[], wind=[], humidity=[], rain=[];
    filtered.forEach(d=>{
      labels.push(new Date(d.date));
      temp.push(d.tempf);
      wind.push(d.windspeedmph);
      humidity.push(d.humidity);
      rain.push(d.hourlyrainin);
    });
    return {labels,temp,wind,humidity,rain};
  }
}

// Create or update chart
function updateCharts(){
  const data = getProcessedData();
  createChart("tempChart","Temperature",data.temp,data.labels,"orange","°F");
  createChart("windChart","Wind Speed",data.wind,data.labels,"cyan","mph");
  createChart("humidityChart","Humidity",data.humidity,data.labels,"lime","%");
  createChart("rainChart","Rain",data.rain,data.labels,"blue","in");
}

// Chart creation function
function createChart(id,label,data,labels,color,unit){
  if(charts[id]){
    charts[id].data.labels = labels;
    charts[id].data.datasets[0].data = data;
    charts[id].update();
  } else {
    charts[id] = new Chart(document.getElementById(id),{
      type:"line",
      data:{labels:labels,datasets:[{label,label,data,borderColor:color,backgroundColor:"rgba(255,255,255,0.1)",tension:0.4,pointRadius:0}]},
      options:{
        responsive:true,
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:false},
          zoom:{
            zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:"x"},
            pan:{enabled:true,mode:"x"}
          },
          tooltip:{
            callbacks:{label:ctx=>ctx.dataset.label+": "+ctx.formattedValue+" "+unit}
          }
        },
        scales:{
          x:{type:"time",time:{tooltipFormat:"MMM d, h:mm a"}},
          y:{beginAtZero:false}
        }
      }
    });
  }
}

// Control panel functions
function resetZoom(){Object.values(charts).forEach(c=>c.resetZoom());}
function setIntervalHours(h){currentInterval=h;updateCharts();}

// Initial load
loadCurrent();
loadHistory();
setInterval(loadCurrent,60000);
</script>

</body>
</html>
