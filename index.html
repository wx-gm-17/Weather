<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1b2a">
<title>Cannoli Station Pro</title>

<link rel="manifest" href="data:application/manifest+json,{"name":"Cannoli Weather","short_name":"Cannoli","start_url":".","display":"standalone","background_color":"#0c1b2a","theme_color":"#0c1b2a","icons":[{"src":"icon.png","sizes":"192x192","type":"image/png"}]}">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root {
  --bg-color: #0c1b2a;
  --card-bg: rgba(28, 61, 90, 0.85);
  --glass-border: rgba(255, 255, 255, 0.15);
  --accent-blue: #4dadff;
}

html, body { 
  margin:0; padding:0; background: var(--bg-color); color:white; 
  width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif;
  overscroll-behavior-y: contain;
}

header { 
  background: #142b44; padding: 15px; text-align:center; font-size:22px; 
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
}

.refresh-btn {
  background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
  color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px;
}

.dashboard { 
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; padding:15px;
  background-image: url('https://placekitten.com/g/300/300');
  background-size: 200px; background-repeat: repeat; background-blend-mode: overlay;
}

.card { 
  background: var(--card-bg); backdrop-filter: blur(10px);
  padding: 18px 10px; border-radius: 14px; text-align: center; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
}

.label { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
.main-val { font-size: 34px; font-weight: 700; margin: 4px 0; }
.sub-val { font-size: 12px; color: var(--accent-blue); font-weight: 500; }

/* Dynamic Temp Colors */
.temp-cold { color: #4dadff !important; }
.temp-warm { color: #ff9f4d !important; }
.temp-hot { color: #ff4d4d !important; }
.alert-red { color: #ff4d4d !important; }

/* Fullscreen Views */
.overlay-view {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background: var(--bg-color); z-index: 1000; flex-direction:column;
}

.toolbar { display:flex; gap:8px; padding:15px; justify-content: center; background: #142b44; }
.toolbar button { background: #1c3d5a; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 600; }

.content-area { flex: 1; overflow-y: auto; padding: 10px; }
.chart-container { height: 50vh; background: #fff; border-radius: 12px; margin-bottom: 15px; }

/* Professional Table Styling */
table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 13px; }
th { background: rgba(255,255,255,0.1); padding: 12px; text-align: left; position: sticky; top: 0; }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

footer { padding: 15px; text-align: center; font-size: 10px; opacity: 0.5; }
</style>
</head>

<body>
<header>
  <div style="width: 50px;"></div>
  <span>🐾 CANNOLI STATION</span>
  <button class="refresh-btn" onclick="location.reload()">Refresh</button>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')">
    <div class="label">Temperature</div>
    <div id="temp" class="main-val notranslate">--</div>
    <div id="temp-sub" class="sub-val">H: -- L: --</div>
  </div>
  
  <div class="card" onclick="openChart('humidity')">
    <div class="label">Humidity</div>
    <div id="humidity" class="main-val notranslate">--</div>
    <div id="humidity-sub" class="sub-val">H: -- L: --</div>
  </div>

  <div class="card" onclick="openChart('wind')">
    <div class="label">Wind Speed</div>
    <div id="wind" class="main-val notranslate">--</div>
    <div id="wind-sub" class="sub-val">Avg: --</div>
  </div>

  <div class="card" onclick="openChart('gust')">
    <div class="label">Wind Gust</div>
    <div id="gust" class="main-val notranslate">--</div>
    <div id="gust-sub" class="sub-val">Max: --</div>
  </div>

  <div class="card" onclick="openChart('rain')">
    <div class="label">Daily Rain</div>
    <div id="rain" class="main-val notranslate">--</div>
    <div id="rain-sub" class="sub-val">Month: --</div>
  </div>

  <div class="card" onclick="openChart('pressure')">
    <div class="label">Pressure</div>
    <div id="pressure" class="main-val notranslate">--</div>
    <div id="pressure-sub" class="sub-val">Trend: --</div>
  </div>
</div>

<div class="overlay-view" id="overlay">
  <div class="toolbar">
    <button onclick="toggleTable()">View Table</button>
    <button onclick="resetZoom()">Reset Zoom</button>
    <button onclick="closeOverlay()" style="background:#d32f2f;">✕ Close</button>
  </div>
  
  <div class="content-area">
    <div class="chart-container" id="chartBox">
      <canvas id="fullChart"></canvas>
    </div>
    
    <div id="tableView" style="display:none;">
      <table id="dataTable">
        <thead><tr><th>Time</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<footer id="time">STATION STATUS: LOADING...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = [];
let fullChartInstance = null;
let currentVar = 'temp';

async function updateUI() {
  try {
    const r = await fetch(`https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`);
    const data = await r.json();
    const w = data[0].lastData;

    // Main Displays
    setVal("temp", Math.round(w.tempf) + "°");
    setVal("humidity", w.humidity + "%");
    setVal("wind", Math.round(w.windspeedmph));
    setVal("gust", Math.round(w.windgustmph));
    setVal("rain", w.dailyrainin.toFixed(2) + '"');
    setVal("pressure", w.baromrelin.toFixed(2));

    // Dynamic Colors
    const t = document.getElementById("temp");
    t.className = "main-val notranslate";
    if(w.tempf < 32) t.classList.add("temp-cold");
    else if(w.tempf >= 90) t.classList.add("temp-hot");
    else if(w.tempf >= 80) t.classList.add("temp-warm");

    if(w.windgustmph >= 30) document.getElementById("gust").classList.add("alert-red");

    document.getElementById("time").innerText = "STATION ONLINE • " + new Date().toLocaleTimeString();
    
    loadHistory(); // Trigger history load for H/L
  } catch(e) { console.error(e); }
}

async function loadHistory() {
  const r = await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`);
  allHistory = (await r.json()).reverse();
  calculateStats();
}

function calculateStats() {
  if(!allHistory.length) return;
  
  const temps = allHistory.map(d => d.tempf);
  document.getElementById("temp-sub").innerText = `H: ${Math.round(Math.max(...temps))}° L: ${Math.round(Math.min(...temps))}°`;
  
  const hums = allHistory.map(d => d.humidity);
  document.getElementById("humidity-sub").innerText = `H: ${Math.max(...hums)}% L: ${Math.min(...hums)}%`;
  
  const gusts = allHistory.map(d => d.windgustmph);
  document.getElementById("gust-sub").innerText = `Max: ${Math.max(...gusts)} mph`;
}

function setVal(id, val) { document.getElementById(id).innerText = val; }

function openChart(v) {
  currentVar = v;
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('tableView').style.display = 'none';
  renderChart();
}

function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

function toggleTable() {
  const view = document.getElementById('tableView');
  view.style.display = view.style.display === 'none' ? 'block' : 'none';
  if(view.style.display === 'block') generateTable();
}

function generateTable() {
  const tbody = document.querySelector("#dataTable tbody");
  tbody.innerHTML = "";
  const unit = currentVar === 'temp' ? '°F' : currentVar === 'humidity' ? '%' : ' mph';
  
  allHistory.slice().reverse().forEach(d => {
    const row = `<tr><td>${new Date(d.date).toLocaleTimeString([], {hour:'2d', minute:'2d'})}</td><td>${d[getVarKey(currentVar)]}${unit}</td></tr>`;
    tbody.innerHTML += row;
  });
}

function getVarKey(v) {
  return v === 'temp' ? 'tempf' : v === 'humidity' ? 'humidity' : v === 'wind' ? 'windspeedmph' : v === 'gust' ? 'windgustmph' : v === 'rain' ? 'hourlyrainin' : 'baromrelin';
}

function renderChart() {
  const labels = allHistory.map(d => new Date(d.date));
  const vals = allHistory.map(d => d[getVarKey(currentVar)]);

  if(fullChartInstance) fullChartInstance.destroy();
  fullChartInstance = new Chart(document.getElementById('fullChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: vals, borderColor: '#4dadff', backgroundColor: 'rgba(77,173,255,0.1)', fill: true, tension: 0.4, pointRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { zoom: { pan: { enabled: true, mode: 'x' }, zoom: { pinch: { enabled: true }, mode: 'x' } } } }
  });
}

function resetZoom() { if(fullChartInstance) fullChartInstance.resetZoom(); }

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
