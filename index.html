<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cannoli Pro v2</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>

:root{
--bg:#060d14;
--card:#12202f;
--accent:#00d2ff;
--border:rgba(255,255,255,.15);
--text:white;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Inter;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#0b141d;
border-bottom:2px solid var(--border);
}

.btn{
background:var(--accent);
border:none;
padding:10px 16px;
border-radius:8px;
font-weight:900;
cursor:pointer;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:var(--card);
border-radius:20px;
padding:30px;
text-align:center;
border:2px solid var(--border);
cursor:pointer;
}

.label{
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;
opacity:.7;
}

.main{
font-size:64px;
font-weight:900;
}

.sub{
color:var(--accent);
}

.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#060d14;
flex-direction:column;
z-index:10;
}

.chart-box{
height:60vh;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid rgba(255,255,255,.1);
}

.alert{
background:#ff3b3b;
text-align:center;
padding:8px;
font-weight:900;
}

</style>
</head>

<body>

<header>
<div style="font-weight:900;font-size:20px;">🐾 Cannoli Pro v2</div>
<button class="btn" onclick="location.reload()">Refresh</button>
</header>

<div id="alerts"></div>

<div class="dashboard">

<div class="card" onclick="openChart('temp')">
<div class="label">Temperature</div>
<div id="temp" class="main">--</div>
<div id="feels" class="sub"></div>
</div>

<div class="card" onclick="openChart('wind')">
<div class="label">Wind</div>
<div id="wind" class="main">--</div>
<div id="dir" class="sub"></div>
</div>

<div class="card">
<div class="label">Gust</div>
<div id="gust" class="main">--</div>
</div>

<div class="card">
<div class="label">Humidity</div>
<div id="hum" class="main">--</div>
</div>

<div class="card">
<div class="label">Solar</div>
<div id="solar" class="main">--</div>
</div>

<div class="card">
<div class="label">Rain Today</div>
<div id="rain" class="main">--</div>
</div>

</div>

<div style="padding:20px">

<h2>Radar</h2>

<iframe
width="100%"
height="500"
src="https://www.rainviewer.com/map.html?loc=39.80,-105.09&zoom=7"
style="border:0;border-radius:12px">
</iframe>

</div>

<div id="chartOverlay" class="overlay">

<header>

<button class="btn" onclick="setRange('24h')">24H</button>
<button class="btn" onclick="setRange('7d')">7D</button>
<button class="btn" onclick="setRange('30d')">30D</button>

<button class="btn" onclick="closeChart()">Close</button>

</header>

<div class="chart-box">
<canvas id="chart"></canvas>
</div>

</div>

<script>

const apiKey="0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf843"
const appKey="b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f"
const mac="4C:EB:D6:1E:22:57"

let historyData=[]
let chart
let currentType="temp"

function dew(t,h){
return Math.round(t-((100-h)/5*1.8))
}

function feelsLike(t,h,w){

if(t<=50 && w>3)
return 35.74+(0.6215*t)-(35.75*Math.pow(w,.16))+(0.4275*t*Math.pow(w,.16))

if(t>=80)
return -42.379+2.04901523*t+10.14333127*h

return t
}

function degToCompass(num){

const val=Math.floor((num/22.5)+0.5)

const arr=["N","NNE","NE","ENE","E","ESE","SE","SSE",
"S","SSW","SW","WSW","W","WNW","NW","NNW"]

return arr[val%16]

}

async function loadHistory(){

const r=await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=500`)

historyData=(await r.json()).reverse()

updateDashboard(historyData[historyData.length-1])

}

async function updateLive(){

const r=await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=1`)

const data=await r.json()

const d=data[0]

historyData.push(d)

updateDashboard(d)

if(chart) drawChart()

}

function updateDashboard(d){

temp.innerText=Math.round(d.tempf)+"°"

feels.innerText="Feels "+Math.round(feelsLike(d.tempf,d.humidity,d.windspeedmph))+"°"

wind.innerText=Math.round(d.windspeedmph)

dir.innerText=degToCompass(d.winddir)

gust.innerText=Math.round(d.windgustmph)

hum.innerText=d.humidity+"%"

solar.innerText=d.solarradiation

rain.innerText=d.dailyrainin.toFixed(2)

checkAlerts(d)

}

function checkAlerts(d){

alerts.innerHTML=""

if(d.tempf<=32)
alerts.innerHTML+="<div class='alert'>Freeze Warning</div>"

if(d.windgustmph>=40)
alerts.innerHTML+="<div class='alert'>High Wind Gusts</div>"

}

function openChart(type){

currentType=type

chartOverlay.style.display="flex"

drawChart()

}

function closeChart(){
chartOverlay.style.display="none"
}

function drawChart(){

const map={
temp:"tempf",
wind:"windspeedmph"
}

const data=historyData

if(chart) chart.destroy()

chart=new Chart(chartCanvas.getContext("2d"),{

type:"line",

data:{
labels:data.map(d=>new Date(d.date)),
datasets:[{
label:currentType,
data:data.map(d=>d[map[currentType]]),
borderColor:"#00d2ff",
pointRadius:0,
tension:.3
}]
},

options:{
responsive:true,
interaction:{mode:"index"},
plugins:{
zoom:{
zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:"x"},
pan:{enabled:true,mode:"x"}
}
},
scales:{
x:{type:"time"}
}
}

})

}

function setRange(range){

let cutoff=Date.now()

if(range==="24h") cutoff-=24*3600000
if(range==="7d") cutoff-=7*86400000
if(range==="30d") cutoff-=30*86400000

historyData=historyData.filter(d=>new Date(d.date)>cutoff)

drawChart()

}

loadHistory()

setInterval(updateLive,60000)

</script>

</body>
</html>
