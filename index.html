<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cannoli's Weather Station</title>

<!-- Chart.js + zoom plugin + luxon adapter -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<style>
body { font-family:Segoe UI, Arial; margin:0; background:#0c1b2a; color:white; }
header { background:#142b44; padding:20px; text-align:center; font-size:28px; }
.dashboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; padding:10px; }
.card { background:#1c3d5a; padding:10px; border-radius:12px; text-align:center; cursor:pointer; }
.card:hover { background:#3a5b7c; }
.temp { font-size:32px; font-weight:bold; }
.value { font-size:18px; }
canvas { background:white; border-radius:10px; max-width:100%; }

.fullscreen-chart {
  display:none;
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background:#0c1b2a; z-index:1000;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  padding-top:10px;
}

.fullscreen-chart canvas {
  width:95% !important;
  height:70vh !important; /* smaller height for mobile */
  touch-action: none;     /* enable pinch/zoom/pan */
  border-radius:10px;
}

.fullscreen-toolbar { display:flex; justify-content:flex-end; gap:10px; padding:10px; flex-wrap:wrap; }
.fullscreen-toolbar button { background:#1c3d5a; color:white; border:none; padding:8px 12px; font-size:16px; border-radius:6px; cursor:pointer; }
.fullscreen-toolbar button:hover { background:#3a5b7c; }
.close-chart { background:red; color:white; border:none; padding:10px; font-size:16px; cursor:pointer; border-radius:6px; }
</style>
</head>

<body>
<header>🌤 Cannoli's Weather Station</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')">Temp<br><span id="temp">--</span>°F</div>
  <div class="card" onclick="openChart('humidity')">Humidity<br><span id="humidity">--</span>%</div>
  <div class="card" onclick="openChart('pressure')">Pressure<br><span id="pressure">--</span> inHg</div>
  <div class="card" onclick="openChart('wind')">Wind<br><span id="wind">--</span> mph</div>
  <div class="card" onclick="openChart('gust')">Gust<br><span id="gust">--</span> mph</div>
  <div class="card" onclick="openChart('rain')">Rain<br><span id="rain">--</span> in</div>
</div>

<!-- Fullscreen chart container -->
<div class="fullscreen-chart" id="fullscreenChartContainer">
  <div class="fullscreen-toolbar">
    <button onclick="setIntervalHours(6)">6h</button>
    <button onclick="setIntervalHours(12)">12h</button>
    <button onclick="setIntervalHours(24)">24h</button>
    <button onclick="resetZoom()">Reset Zoom</button>
    <button class="close-chart" onclick="closeChart()">Close</button>
  </div>
  <canvas id="fullChart"></canvas>
</div>

<footer id="time" style="padding:10px;text-align:center;"></footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = [];
let currentVariable = 'temp';
let currentInterval = 24;
let fullChartInstance = null;

// Load live data
async function loadCurrent() {
  try {
    const url = `https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`;
    const r = await fetch(url);
    const data = await r.json();
    const w = data[0].lastData;

    document.getElementById("temp").innerHTML = w.tempf;
    document.getElementById("humidity").innerHTML = w.humidity;
    document.getElementById("pressure").innerHTML = w.baromrelin;
    document.getElementById("wind").innerHTML = w.windspeedmph;
    document.getElementById("gust").innerHTML = w.windgustmph;
    document.getElementById("rain").innerHTML = w.dailyrainin;
    document.getElementById("time").innerHTML = "Last update: " + new Date(w.date).toLocaleString();
  } catch(e){
    console.error("Error loading current data", e);
  }
}

// Load historical data
async function loadHistory() {
  try {
    const url = `https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`;
    const r = await fetch(url);
    const history = await r.json();
    allHistory = history.reverse();
  } catch(e){
    console.error("Error loading history", e);
  }
}

// Open fullscreen chart
function openChart(variable){
  currentVariable = variable;
  document.getElementById('fullscreenChartContainer').style.display = 'flex';
  renderFullChart();
}

// Close fullscreen chart
function closeChart(){
  document.getElementById('fullscreenChartContainer').style.display = 'none';
  if(fullChartInstance) fullChartInstance.destroy();
  fullChartInstance = null;
}

// Reset zoom
function resetZoom(){
  if(fullChartInstance) fullChartInstance.resetZoom();
}

// Set interval (6,12,24 hours)
function setIntervalHours(h){
  currentInterval = h;
  if(fullChartInstance) renderFullChart();
}

// Aggregate hourly for large ranges
function aggregateHourly(data){
  const grouped = {};
  data.forEach(d=>{
    const hour = new Date(d.date);
    hour.setMinutes(0,0,0);
    const key = hour.getTime();
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(d);
  });
  const labels=[], values=[];
  for(const k of Object.keys(grouped).sort((a,b)=>a-b)){
    const arr = grouped[k];
    labels.push(new Date(parseInt(k)));
    const valMap = {
      temp: arr.reduce((s,v)=>s+v.tempf,0)/arr.length,
      humidity: arr.reduce((s,v)=>s+v.humidity,0)/arr.length,
      wind: arr.reduce((s,v)=>s+v.windspeedmph,0)/arr.length,
      gust: arr.reduce((s,v)=>s+v.windgustmph,0)/arr.length,
      rain: arr.reduce((s,v)=>s.hourlyrainin,0)
    };
    values.push(valMap[currentVariable]);
  }
  return {labels, values};
}

// Prepare data for chart
function getChartData(){
  const now = Date.now();
  const cutoff = now - currentInterval*60*60*1000;
  const filtered = allHistory.filter(d=>new Date(d.date).getTime()>=cutoff);
  if(currentInterval >=12){
    return aggregateHourly(filtered);
  } else {
    const labels=[], values=[];
    filtered.forEach(d=>{
      labels.push(new Date(d.date));
      const valMap = { temp: d.tempf, humidity:d.humidity, wind:d.windspeedmph, gust:d.windgustmph, rain:d.hourlyrainin };
      values.push(valMap[currentVariable]);
    });
    return {labels, values};
  }
}

// Render fullscreen chart
function renderFullChart(){
  const data = getChartData();
  const colorMap = {temp:"orange", humidity:"lime", wind:"cyan", gust:"magenta", rain:"blue"};
  const unitMap = {temp:"°F", humidity:"%", wind:"mph", gust:"mph", rain:"in"};

  if(fullChartInstance) fullChartInstance.destroy();
  const ctx = document.getElementById('fullChart').getContext('2d');
  fullChartInstance = new Chart(ctx,{
    type:'line',
    data:{labels:data.labels,datasets:[{label:currentVariable, data:data.values, borderColor:colorMap[currentVariable], backgroundColor:'rgba(255,255,255,0.1)', tension:0.3, pointRadius:0}]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false, labels:{font:{size:Math.min(window.innerWidth/25,16)}}},
        tooltip:{bodyFont:{size:Math.min(window.innerWidth/25,14)}, titleFont:{size:Math.min(window.innerWidth/25,16)}, callbacks:{label:ctx=>ctx.dataset.label+": "+ctx.formattedValue+" "+unitMap[currentVariable]}},
        zoom:{
          pan:{enabled:true, mode:'x', overScaleMode:'x'},
          zoom:{wheel:{enabled:true}, pinch:{enabled:true}, mode:'x', overScaleMode:'x'}
        }
      },
      scales:{
        x:{type:'time', time:{tooltipFormat:'MMM d, h:mm a'}, ticks:{font:{size:Math.min(window.innerWidth/28,12)}}},
        y:{ticks:{font:{size:Math.min(window.innerWidth/28,12)}}}
      }
    }
  });
}

// Initial load
loadCurrent();
loadHistory();
setInterval(loadCurrent,60000);
</script>

</body>
</html>
