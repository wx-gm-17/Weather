<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1b2a">
<title>Cannoli Station</title>

<link rel="manifest" href='data:application/manifest+json,{"name":"Cannoli Weather","short_name":"Cannoli","start_url":".","display":"standalone","background_color":"#0c1b2a","theme_color":"#0c1b2a","icons":[{"src":"icon.png","sizes":"192x192","type":"image/png"}]}'>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root { --bg: #0c1b2a; --card: rgba(28, 61, 90, 0.85); --accent: #4dadff; --border: rgba(255, 255, 255, 0.15); }
body { margin:0; background: var(--bg); color:white; font-family: sans-serif; }
header { background: #142b44; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.refresh-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; }
.dashboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; padding:15px; }
.card { background: var(--card); backdrop-filter: blur(10px); padding: 18px 10px; border-radius: 14px; text-align: center; border: 1px solid var(--border); }
.label { font-size: 11px; text-transform: uppercase; color: #aaa; }
.main-val { font-size: 34px; font-weight: 700; margin: 4px 0; }
.sub-val { font-size: 12px; color: var(--accent); }
.overlay-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; flex-direction:column; }
.toolbar { display:flex; gap:8px; padding:15px; justify-content: center; background: #142b44; }
.content-area { flex: 1; overflow-y: auto; padding: 10px; }
.chart-container { height: 45vh; background: #fff; border-radius: 12px; margin-bottom: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: rgba(255,255,255,0.1); padding: 10px; text-align: left; }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
footer { padding: 15px; text-align: center; font-size: 10px; opacity: 0.5; }
</style>
</head>
<body>

<header>
  <div style="width: 50px;"></div>
  <span>🐾 CANNOLI STATION</span>
  <button class="refresh-btn" onclick="location.reload()">Refresh</button>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')"><div class="label">Temp</div><div id="temp" class="main-val">--</div><div id="temp-sub" class="sub-val">H: -- L: --</div></div>
  <div class="card" onclick="openChart('humidity')"><div class="label">Humidity</div><div id="humidity" class="main-val">--</div><div id="humidity-sub" class="sub-val">--</div></div>
  <div class="card" onclick="openChart('wind')"><div class="label">Wind</div><div id="wind" class="main-val">--</div><div id="wind-sub" class="sub-val">MPH</div></div>
  <div class="card" onclick="openChart('gust')"><div class="label">Gust</div><div id="gust" class="main-val">--</div><div id="gust-sub" class="sub-val">Max: --</div></div>
  <div class="card" onclick="openChart('rain')"><div class="label">Rain</div><div id="rain" class="main-val">--</div><div id="rain-sub" class="sub-val">Daily</div></div>
  <div class="card" onclick="openChart('pressure')"><div class="label">Pressure</div><div id="pressure" class="main-val">--</div><div id="pressure-sub" class="sub-val">InHg</div></div>
</div>

<div class="overlay-view" id="overlay">
  <div class="toolbar">
    <button onclick="toggleTable()">View Table</button>
    <button onclick="closeOverlay()" style="background:#d32f2f; color:white;">✕ Close</button>
  </div>
  <div class="content-area">
    <div class="chart-container"><canvas id="fullChart"></canvas></div>
    <div id="tableView" style="display:none;"><table><thead><tr><th>Time</th><th>Value</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<footer id="time">STATUS: INITIALIZING...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";
let allHistory = [], fullChartInstance = null, currentVar = 'temp';

async function fetchData(url) {
  const r = await fetch(url);
  if (r.status === 429) throw new Error("Rate limit hit. Waiting...");
  return r.json();
}

async function updateUI() {
  try {
    const data = await fetchData(`https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`);
    const w = data[0].lastData;
    document.getElementById("temp").innerText = Math.round(w.tempf) + "°";
    document.getElementById("humidity").innerText = w.humidity + "%";
    document.getElementById("wind").innerText = Math.round(w.windspeedmph);
    document.getElementById("gust").innerText = Math.round(w.windgustmph);
    document.getElementById("rain").innerText = w.dailyrainin.toFixed(2);
    document.getElementById("pressure").innerText = w.baromrelin.toFixed(2);
    document.getElementById("time").innerText = "ONLINE • " + new Date().toLocaleTimeString();
    
    // Small delay before fetching history to avoid 429
    setTimeout(loadHistory, 1500);
  } catch(e) { document.getElementById("time").innerText = e.message; }
}

async function loadHistory() {
  try {
    const data = await fetchData(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`);
    allHistory = Array.isArray(data) ? data.reverse() : [];
    if(allHistory.length) {
      const temps = allHistory.map(d => d.tempf);
      document.getElementById("temp-sub").innerText = `H: ${Math.round(Math.max(...temps))}° L: ${Math.round(Math.min(...temps))}°`;
      document.getElementById("gust-sub").innerText = `Max: ${Math.max(...allHistory.map(d => d.windgustmph))} MPH`;
    }
  } catch(e) { console.warn("History delay..."); }
}

function openChart(v) {
  currentVar = v;
  document.getElementById('overlay').style.display = 'flex';
  renderChart();
}

function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

function toggleTable() {
  const view = document.getElementById('tableView');
  view.style.display = view.style.display === 'none' ? 'block' : 'none';
  if(view.style.display === 'block') {
    const tbody = document.querySelector("table tbody");
    tbody.innerHTML = allHistory.slice().reverse().map(d => `<tr><td>${new Date(d.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td><td>${d[getVarKey(v = currentVar)]}</td></tr>`).join('');
  }
}

function getVarKey(v) {
  const keys = {temp:'tempf', humidity:'humidity', wind:'windspeedmph', gust:'windgustmph', rain:'hourlyrainin', pressure:'baromrelin'};
  return keys[v];
}

function renderChart() {
  const ctx = document.getElementById('fullChart');
  if(fullChartInstance) fullChartInstance.destroy();
  fullChartInstance = new Chart(ctx, {
    type: 'line',
    data: { 
      labels: allHistory.map(d => new Date(d.date)),
      datasets: [{ data: allHistory.map(d => d[getVarKey(currentVar)]), borderColor: '#4dadff', tension: 0.3, pointRadius: 0 }] 
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
