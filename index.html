<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1b2a">
<title>Cannoli Station</title>

<link rel="manifest" href="data:application/manifest+json,{"name":"Cannoli Weather","short_name":"Cannoli","start_url":".","display":"standalone","background_color":"#0c1b2a","theme_color":"#0c1b2a","icons":[{"src":"https://placekitten.com/192/192","sizes":"192x192","type":"image/png"}]}">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root {
  --bg-color: #0c1b2a;
  --card-bg: rgba(28, 61, 90, 0.85);
  --glass-border: rgba(255, 255, 255, 0.15);
}

html, body { 
  margin:0; padding:0; background: var(--bg-color); color:white; overflow: hidden; 
  position: fixed; width: 100%; height: 100%; overscroll-behavior-y: contain; 
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

header { 
  background: #142b44;
  padding: 15px; text-align:center; font-size:24px; font-weight: 300;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--glass-border);
}

.refresh-btn {
  background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
  color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
}

.dashboard { 
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; padding:15px; 
  overflow-y: auto; max-height: 85vh;
  /* Watermark Fix: Using a reliable placeholder tabby */
  background-image: url('https://placekitten.com/g/200/200');
  background-size: 150px; background-repeat: repeat; background-blend-mode: overlay;
  background-color: rgba(12, 27, 42, 0.9); /* Makes it look like a watermark */
}

.card { 
  background: var(--card-bg); backdrop-filter: blur(8px);
  padding: 15px 10px; border-radius: 12px; text-align: center; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
}

.label { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 4px; }
.main-val { font-size: 32px; font-weight: 700; margin: 2px 0; }
.sub-val { font-size: 11px; color: #666; }

/* Color Scales */
.temp-cold { color: #4dadff !important; }
.temp-warm { color: #ff9f4d !important; }
.temp-hot { color: #ff4d4d !important; }
.alert-red { color: #ff4d4d !important; font-weight: 900; }

.fullscreen-chart {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background: var(--bg-color); z-index: 1000; flex-direction:column; align-items:center;
}
.chart-container { position: relative; width: 95%; height: 60vh; background: #fff; border-radius: 12px; overflow: hidden; }
.fullscreen-toolbar { display:flex; gap:10px; padding:20px; }
.fullscreen-toolbar button { background: #1c3d5a; color: white; border: none; padding: 10px 15px; border-radius: 6px; }
footer { padding: 10px; text-align: center; font-size: 10px; opacity: 0.4; position: absolute; bottom: 0; width: 100%; }
</style>
</head>

<body>
<header>
  <div style="width: 40px;"></div> <span>🐾 CANNOLI STATION</span>
  <button class="refresh-btn" onclick="location.reload()">Refresh</button>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')">
    <div class="label">Temperature</div>
    <div id="temp" class="main-val notranslate">--</div>
    <div id="temp-sub" class="sub-val">H: -- L: --</div>
  </div>
  
  <div class="card" onclick="openChart('humidity')">
    <div class="label">Humidity</div>
    <div id="humidity" class="main-val notranslate">--</div>
    <div id="humidity-sub" class="sub-val">Indoor: --</div>
  </div>

  <div class="card" onclick="openChart('wind')">
    <div class="label">Wind Speed</div>
    <div id="wind" class="main-val notranslate">--</div>
    <div class="sub-val">Steady MPH</div>
  </div>

  <div class="card" onclick="openChart('gust')">
    <div class="label">Wind Gust</div>
    <div id="gust" class="main-val notranslate">--</div>
    <div id="gust-sub" class="sub-val">Max: --</div>
  </div>

  <div class="card" onclick="openChart('rain')">
    <div class="label">Rain</div>
    <div id="rain" class="main-val notranslate">--</div>
    <div id="rain-sub" class="sub-val">Today</div>
  </div>

  <div class="card" onclick="openChart('pressure')">
    <div class="label">Pressure</div>
    <div id="pressure" class="main-val notranslate">--</div>
    <div class="sub-val">InHg</div>
  </div>
</div>

<div class="fullscreen-chart" id="fullscreenChartContainer">
  <div class="fullscreen-toolbar">
    <button onclick="setIntervalHours(6)">6H</button>
    <button onclick="setIntervalHours(24)">24H</button>
    <button class="close-chart" onclick="closeChart()" style="background:#d32f2f;">✕</button>
  </div>
  <div class="chart-container"><canvas id="fullChart"></canvas></div>
</div>

<footer id="time">Loading...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";

let allHistory = [];
let fullChartInstance = null;
let currentVariable = 'temp';

async function updateUI() {
  try {
    const url = `https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`;
    const r = await fetch(url);
    const data = await r.json();
    const w = data[0].lastData;

    // Temp Scale
    const tElem = document.getElementById("temp");
    const temp = w.tempf;
    tElem.innerText = Math.round(temp) + "°";
    tElem.className = "main-val notranslate";
    if(temp < 32) tElem.classList.add("temp-cold");
    else if(temp >= 90) tElem.classList.add("temp-hot");
    else if(temp >= 80) tElem.classList.add("temp-warm");

    // Gust Scale
    const gElem = document.getElementById("gust");
    const gust = w.windgustmph;
    gElem.innerText = Math.round(gust);
    if(gust >= 30) gElem.classList.add("alert-red");

    document.getElementById("temp-sub").innerText = `Feels: ${w.feelsLike}°`;
    document.getElementById("humidity").innerText = w.humidity + "%";
    document.getElementById("wind").innerText = Math.round(w.windspeedmph);
    document.getElementById("rain").innerText = w.dailyrainin.toFixed(2);
    document.getElementById("pressure").innerText = w.baromrelin.toFixed(2);
    document.getElementById("time").innerText = "Updated: " + new Date().toLocaleTimeString();
  } catch(e) { console.error(e); }
}

async function loadHistory() {
  const url = `https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`;
  const r = await fetch(url);
  allHistory = (await r.json()).reverse();
}

function openChart(v) {
  currentVariable = v;
  document.getElementById('fullscreenChartContainer').style.display = 'flex';
  renderFullChart();
}

function closeChart() { document.getElementById('fullscreenChartContainer').style.display = 'none'; }

function renderFullChart() {
  const labels = allHistory.map(d => new Date(d.date));
  const dataMap = { temp: allHistory.map(d => d.tempf), gust: allHistory.map(d => d.windgustmph), humidity: allHistory.map(d => d.humidity), wind: allHistory.map(d => d.windspeedmph), rain: allHistory.map(d => d.hourlyrainin || 0), pressure: allHistory.map(d => d.baromrelin) };

  if(fullChartInstance) fullChartInstance.destroy();
  fullChartInstance = new Chart(document.getElementById('fullChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: dataMap[currentVariable], borderColor: '#4dadff', fill: true, tension: 0.4, pointRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { zoom: { pan: { enabled: true, mode: 'x' }, zoom: { pinch: { enabled: true }, mode: 'x' } } } }
  });
}

updateUI();
loadHistory();
setInterval(updateUI, 60000);
</script>
</body>
</html>
