<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060d14">
<title>Cannoli Pro v8</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
:root { 
  --bg: #060d14; --card: rgba(18, 32, 47, 0.95); --accent: #00d2ff; 
  --border: rgba(255, 255, 255, 0.15); --text: #ffffff;
}

body { margin:0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

header { 
  background: #0b141d; padding: 20px; display: flex; justify-content: space-between; 
  align-items: center; border-bottom: 2px solid var(--border);
}

.paw { font-size: 32px; vertical-align: middle; }
.btn { background: var(--accent); border: none; color: #000; padding: 12px 18px; border-radius: 8px; font-weight: 900; cursor: pointer; }
.btn-secondary { background: #1c3d5a; color: white; margin-right: 10px; }

.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; padding: 20px; }

.card { 
  background: var(--card); padding: 30px 15px; border-radius: 20px; text-align: center; 
  border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: pointer;
}

.label { font-size: 14px; text-transform: uppercase; color: #8899a6; font-weight: 900; letter-spacing: 1px; }
.main-val { font-size: 64px; font-weight: 900; margin: 10px 0; color: #fff; }
.sub-val { font-size: 14px; color: var(--accent); font-weight: 700; }

/* Summary Table Section */
.summary-container { margin: 0 20px 30px 20px; background: #0b141d; border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.summary-table th { background: #14212d; color: #8899a6; padding: 12px; text-align: left; font-weight: 900; border-bottom: 1px solid var(--border); }
.summary-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

/* Overlays */
.overlay-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; flex-direction:column; }
.toolbar { display:flex; gap:10px; padding:15px; background: #0b141d; align-items: center; border-bottom: 1px solid var(--border); }
.content-area { flex: 1; overflow-y: auto; padding: 15px; }
.chart-container { height: 50vh; background: #0b141d; border-radius: 12px; border: 1px solid var(--border); padding: 10px; touch-action: none; position: relative; }

/* Master Table Styling */
.table-wrapper { border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
table th { background: #1c3d5a; padding: 8px 4px; color: var(--accent); text-align: center; width: 1%; }
table td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center; width: 1%; }

footer { padding: 20px; text-align: center; font-size: 12px; color: #556677; }
</style>
</head>
<body>

<header>
  <div><span class="paw">🐾</span> <span style="letter-spacing: 2px; font-weight: 900;">CANNOLI PRO</span></div>
  <div>
    <button class="btn btn-secondary" onclick="openMasterTable()">MASTER LOG</button>
    <button class="btn" onclick="location.reload()">REFRESH</button>
  </div>
</header>

<div class="dashboard">
  <div class="card" onclick="openChart('temp')"><div class="label">Temp / Dew</div><div id="temp" class="main-val">--</div><div id="dew-sub" class="sub-val">Dew: --</div></div>
  <div class="card" onclick="openChart('wind')"><div class="label">Wind / Gust</div><div id="wind" class="main-val">--</div><div id="gust-sub" class="sub-val">Gust: -- | Dir: --</div></div>
  <div class="card" onclick="openChart('solar')"><div class="label">Solar / UV</div><div id="solar" class="main-val">--</div><div id="uv-sub" class="sub-val">UV Index: --</div></div>
  <div class="card" onclick="openChart('rain')"><div class="label">Rainfall</div><div id="rain" class="main-val">--</div><div class="sub-val">DAILY TOTAL</div></div>
  <div class="card" onclick="openChart('pressure')"><div class="label">Pressure</div><div id="pressure" class="main-val">--</div><div class="sub-val">hPa</div></div>
</div>

<div class="summary-container">
  <table class="summary-table">
    <thead><tr><th>Metric</th><th>High</th><th>Low</th><th>Avg</th></tr></thead>
    <tbody id="summaryBody">
      <tr><td>Temperature</td><td id="s-th">-</td><td id="s-tl">-</td><td id="s-ta">-</td></tr>
      <tr><td>Wind Speed</td><td id="s-wh">-</td><td id="s-wl">-</td><td id="s-wa">-</td></tr>
    </tbody>
  </table>
</div>

<div class="overlay-view" id="overlay">
  <div class="toolbar">
    <h2 id="graphTitle" style="flex-grow:1; margin:0; font-size:16px;">Details</h2>
    <button class="btn btn-secondary" onclick="fullChartInstance.resetZoom()">RESET</button>
    <button class="btn btn-secondary" onclick="toggleTable()" id="toggleBtn">TABLE</button>
    <button class="btn" onclick="closeOverlay()" style="background:#ff4d4d;">✕</button>
  </div>
  <div class="content-area">
    <div class="chart-container"><canvas id="fullChart"></canvas></div>
    <div id="tableView" style="display:none; margin-top:15px;" class="table-wrapper">
      <table id="detailTable"><thead><tr><th>Date/Time</th><th>Value</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<div class="overlay-view" id="masterOverlay">
  <div class="toolbar"><h2>MASTER DATA LOG</h2><button class="btn" onclick="document.getElementById('masterOverlay').style.display='none'">CLOSE</button></div>
  <div class="content-area">
    <div class="table-wrapper"><table id="masterTable"><thead>
      <tr><th>Time</th><th>Temp</th><th>Dew</th><th>Hum</th><th>Wind</th><th>Gust</th><th>hPa</th><th>Solar</th><th>UV</th></tr>
    </thead><tbody></tbody></table></div>
  </div>
</div>

<footer id="status">METRICS LOADING...</footer>

<script>
const apiKey = "0b536def96f74e888a0f2ac984b5fda8caaa5d23e6d645afbdf8431e692ce2a5";
const appKey = "b8c618a136b34f788d4b62b59ef4bff0af7948990eb14c17a90062bdef78781f";
const mac = "4C:EB:D6:1E:22:57";
let allHistory = [], fullChartInstance = null, currentVar = 'temp';

function degToCompass(num) {
    const val = Math.floor((num / 22.5) + 0.5);
    const arr = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return arr[(val % 16)];
}

async function updateUI() {
  try {
    const r = await fetch(`https://rt.ambientweather.net/v1/devices?apiKey=${apiKey}&applicationKey=${appKey}`);
    const data = await r.json();
    const w = data[0].lastData;

    document.getElementById("temp").innerText = Math.round(w.tempf) + "°";
    document.getElementById("wind").innerText = Math.round(w.windspeedmph);
    document.getElementById("gust-sub").innerText = `Gust: ${Math.round(w.windgustmph)} | Dir: ${degToCompass(w.winddir)}`;
    document.getElementById("solar").innerText = w.solarradiation;
    document.getElementById("uv-sub").innerText = `UV Index: ${w.uv}`;
    document.getElementById("rain").innerText = w.dailyrainin.toFixed(2);
    document.getElementById("pressure").innerText = Math.round(w.baromrelin * 33.8639); // inHg to hPa
    
    const dew = w.tempf - ((100 - w.humidity) / 5 * 1.8);
    document.getElementById("dew-sub").innerText = `Dew Point: ${Math.round(dew)}°`;

    document.getElementById("status").innerText = "STATION ONLINE • " + new Date().toLocaleTimeString();
    setTimeout(loadHistory, 1200);
  } catch(e) {}
}

async function loadHistory() {
  const r = await fetch(`https://rt.ambientweather.net/v1/devices/${mac}?apiKey=${apiKey}&applicationKey=${appKey}&limit=288`);
  const data = await r.json();
  allHistory = Array.isArray(data) ? data.reverse() : [];
  
  if(allHistory.length) {
    const temps = allHistory.map(d => d.tempf);
    const winds = allHistory.map(d => d.windspeedmph);
    document.getElementById("s-th").innerText = Math.max(...temps) + "°";
    document.getElementById("s-tl").innerText = Math.min(...temps) + "°";
    document.getElementById("s-ta").innerText = (temps.reduce((a,b)=>a+b)/temps.length).toFixed(1) + "°";
    document.getElementById("s-wh").innerText = Math.max(...winds) + " mph";
    document.getElementById("s-wa").innerText = (winds.reduce((a,b)=>a+b)/winds.length).toFixed(1) + " mph";
  }
}

function openChart(v) {
  currentVar = v;
  document.getElementById('overlay').style.display = 'flex';
  renderChart();
}

function openMasterTable() {
  document.getElementById('masterOverlay').style.display = 'flex';
  const tbody = document.querySelector("#masterTable tbody");
  tbody.innerHTML = allHistory.slice().reverse().map(d => `
    <tr>
      <td>${new Date(d.date).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
      <td>${Math.round(d.tempf)}°</td>
      <td>${Math.round(d.tempf - ((100 - d.humidity) / 5 * 1.8))}°</td>
      <td>${d.humidity}%</td>
      <td>${Math.round(d.windspeedmph)}</td>
      <td>${Math.round(d.windgustmph)}</td>
      <td>${Math.round(d.baromrelin * 33.8639)}</td>
      <td>${d.solarradiation}</td>
      <td>${d.uv}</td>
    </tr>
  `).join('');
}

function toggleTable() {
  const view = document.getElementById('tableView');
  view.style.display = view.style.display === 'none' ? 'block' : 'none';
  if(view.style.display === 'block') {
    const tbody = document.querySelector("#detailTable tbody");
    tbody.innerHTML = allHistory.slice().reverse().map(d => `
      <tr><td>${new Date(d.date).toLocaleString()}</td><td>${d[getVarKey(currentVar)] || '--'}</td></tr>
    `).join('');
  }
}

function getVarKey(v) {
  return {temp:'tempf', wind:'windspeedmph', gust:'windgustmph', solar:'solarradiation', rain:'dailyrainin', pressure:'baromrelin'}[v];
}

function renderChart() {
  const ctx = document.getElementById('fullChart');
  if(fullChartInstance) fullChartInstance.destroy();
  
  const isWind = currentVar === 'wind';
  const datasets = [{
    label: currentVar.toUpperCase(),
    data: allHistory.map(d => d[getVarKey(currentVar)]),
    borderColor: '#00d2ff', backgroundColor: 'rgba(0, 210, 255, 0.1)',
    fill: true, tension: 0.2, pointRadius: 0
  }];

  if(isWind) {
    datasets.push({
      label: 'GUST',
      data: allHistory.map(d => d.windgustmph),
      borderColor: '#ff4d4d', backgroundColor: 'transparent',
      borderDash: [5, 5], tension: 0.2, pointRadius: 0
    });
  }

  fullChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: allHistory.map(d => new Date(d.date)), datasets },
    options: { 
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        zoom: { pan: { enabled: true, mode: 'xy' }, zoom: { pinch: { enabled: true }, mode: 'xy' } },
        tooltip: {
            callbacks: {
                title: (items) => new Date(items[0].parsed.x).toLocaleString()
            }
        }
      },
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
